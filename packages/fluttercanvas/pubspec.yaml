name: fluttercanvas
description: Open-source drag-and-drop UI builder for Flutter. Design screens visually, preview them on phone, tablet, Mac and web, then export responsive code.
version: 0.3.0
homepage: https://github.com/Sulmanali77/fluttercanvas
repository: https://github.com/Sulmanali77/fluttercanvas/tree/main/packages/fluttercanvas
issue_tracker: https://github.com/Sulmanali77/fluttercanvas/issues
topics:
  - ui
  - drag-and-drop
  - code-generation
  - responsive
  - design
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  fluttercanvas_core: ^0.3.0
  fluttercanvas_renderer: ^0.3.0
  http: ^1.2.0
  file_picker: ">=8.0.0 <11.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
